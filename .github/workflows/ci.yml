name: FleetLeak CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit, Integration & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio behave httpx

      - name: Run Pytest Unit Tests with Coverage
        run: |
          python -m pytest tests/unit --cov=services --cov-report=xml --cov-report=term

      - name: Run Security Red-Team Tests
        run: |
          python -m pytest tests/security/test_agent_guardrails.py

      - name: Run REST Integration Tests
        run: |
          python -m pytest tests/integration/test_api_endpoints.py

      - name: Run BDD Acceptance Tests
        run: |
          python -m behave tests/bdd
